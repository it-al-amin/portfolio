# Render Blueprint: Dashboard > New > Blueprint > pick this repo.
# The free plan has no persistent disk: the SQLite database and uploads reset on every restart or deploy.
services:
  - type: web
    name: portfolio
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8080"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
