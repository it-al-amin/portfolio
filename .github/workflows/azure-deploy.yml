# Builds the API and deploys it to Azure App Service on every push to main.
# Requires repository secret AZURE_WEBAPP_PUBLISH_PROFILE (the Web App's downloaded publish profile)
# and repository variable AZURE_WEBAPP_NAME (the Web App's name).
name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish backend/Portfolio.Api/Portfolio.Api.csproj -c Release -o ${{ runner.temp }}/app

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ runner.temp }}/app
